; GameMode: runs while a game started with `gamemoderun` (see Steam launch options) is open.
; https://github.com/FeralInteractive/gamemode/blob/master/example/gamemode.ini

[custom]
; Free the RTX 5090 for the game: pause this PC's Ollama (the homeserver's AI node) and resume it afterwards.
start=sh -c '"$HOME"/.local/bin/rice/syna-ai-node pause'
end=sh -c '"$HOME"/.local/bin/rice/syna-ai-node resume'
script_timeout=20
