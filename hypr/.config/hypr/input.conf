# Input Configuration
# See https://wiki.hypr.land/Configuring/Variables/#input
#
# Machine-specific input settings go in input.local.conf
# (accel_profile, sensitivity, touchpad, numlock preference)

# Universal input settings (apply to all machines)
input {
    kb_options = compose:caps
    repeat_rate = 40
    repeat_delay = 600
}

# Source machine-specific input config
source = ~/.config/hypr/input.local.conf
