# Control your input devices
# See https://wiki.hypr.land/Configuring/Variables/#input

# Input configuration – optimized for FPS gaming
# Flat accel, stable muscle memory, consistent across all mice

input {
  kb_options = compose:caps

  repeat_rate = 40
  repeat_delay = 600
  numlock_by_default = true

  # FPS-friendly: no acceleration curve (raw input)
  accel_profile = flat

  # Global mouse sensitivity (applies to all mice)
  # Range: -1.0 to 1.0, negative = slower, 0 = default
  sensitivity = -0.3

  # Global scroll speed (applies to all mice)
  scroll_factor = 3.0
}
# Scroll nicely in the terminal
#windowrule = scrolltouchpad 1.5, class:(Alacritty|kitty)
#windowrule = scrolltouchpad 0.2, class:com.mitchellh.ghostty

# Enable touchpad gestures for changing workspaces
# See https://wiki.hyprland.org/Configuring/Gestures/
# gesture = 3, horizontal, workspace
