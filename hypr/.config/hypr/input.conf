# Control your input devices
# See https://wiki.hypr.land/Configuring/Variables/#input

# Input configuration – optimized for FPS (CS)
# Flat accel, stable muscle memory, no scroll weirdness
# Control your input devices (Hyprland 0.53+)

input {
  kb_options = compose:caps

  repeat_rate = 40
  repeat_delay = 600
  numlock_by_default = true

  # FPS-friendly: no accel curve
  accel_profile = flat

  # Leave global at default so only the real mouse gets tuned
  sensitivity = 0.0

  # (Optional) global scroll. Remove if you don’t want to affect wheel speed.
  # scroll_factor = 1.0
}

# Per-device mouse tuning (name must match `hyprctl devices` exactly)
device {
  name = --hitscan-8k-dongle-mouse
  sensitivity = -0.3
  scroll_factor = 3.0
}

# Scroll nicely in the terminal
#windowrule = scrolltouchpad 1.5, class:(Alacritty|kitty)
#windowrule = scrolltouchpad 0.2, class:com.mitchellh.ghostty

# Enable touchpad gestures for changing workspaces
# See https://wiki.hyprland.org/Configuring/Gestures/
# gesture = 3, horizontal, workspace
