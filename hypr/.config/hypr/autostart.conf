# Extra autostart processes
# exec-once = uwsm-app -- my-service

# EWW dashboard animations (fast)
animation = layersIn, 1, 1, default, slide
animation = layersOut, 1, 1, default, slide

# EWW dashboard hover trigger (auto-detects monitors)
exec-once = adept-eww-init

# EWW dashboard focus watcher (closes on window focus change)
exec-once = adept-dashboard-focus-watcher

# Browser opacity daemon (opaque when playing audio on media sites)
exec-once = adept-audio-opacity-daemon

# chromium -> workspace 2
#exec-once = [workspace 2 silent] chromium
#exec-once = ~/.local/bin/adept-wallpaper

bind = SUPER, SPACE, exec, walker
bind = SUPER, D, exec, eww active-windows | grep -q dashboard && eww close dashboard || (eww update cal-day=$(date +%d) cal-month=$(date +%m) cal-year=$(date +%Y) && eww open dashboard --screen $(hyprctl monitors -j | jq '.[] | select(.focused==true) | if .id == 1 then 0 else 1 end'))


# btop → workspace 4
exec-once = [workspace 4 silent] ghostty -e btop
