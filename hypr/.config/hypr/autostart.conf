# Autostart Configuration
# Machine-specific startup apps go in autostart.local.conf

# EWW dashboard animations (fast)
animation = layersIn, 1, 1, default, slide
animation = layersOut, 1, 1, default, slide

# Universal exec-once commands
exec-once = syna-eww-init
exec-once = syna-dashboard-focus-watcher
exec-once = syna-audio-opacity-daemon

# Universal keybinds
bind = SUPER, D, exec, syna-dashboard-toggle

# Source machine-specific autostart config
source = ~/.config/hypr/autostart.local.conf
