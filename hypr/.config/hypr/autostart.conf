# Extra autostart processes
# exec-once = uwsm-app -- my-service

# EWW dashboard animations (fast)
animation = layersIn, 1, 1, default, slide
animation = layersOut, 1, 1, default, slide

# EWW dashboard hover trigger (auto-detects monitors)
exec-once = syna-eww-init

# EWW dashboard focus watcher (closes on window focus change)
exec-once = syna-dashboard-focus-watcher

# Browser opacity daemon (opaque when playing audio on media sites)
exec-once = syna-audio-opacity-daemon

# chromium -> workspace 2
#exec-once = [workspace 2 silent] chromium
#exec-once = ~/.local/bin/syna-wallpaper

bind = SUPER, SPACE, exec, walker
bind = SUPER, D, exec, eww active-windows | grep -q syna-dashboard && eww close syna-dashboard || (eww update cal-day=$(date +%d) cal-month=$(date +%m) cal-year=$(date +%Y) && eww open syna-dashboard --screen $(hyprctl monitors -j | jq '.[] | select(.focused==true) | .id'))


# btop → workspace 6
exec-once = [workspace 6 silent] ghostty -e btop
