# Extra autostart processes
# exec-once = uwsm-app -- my-service

# EWW dashboard hover trigger (both monitors)
exec-once = eww open hover-zone-0 && eww open hover-zone-1

# chromium -> workspace 2
#exec-once = [workspace 2 silent] chromium
#exec-once = ~/.local/bin/adept-wallpaper

bind = SUPER, SPACE, exec, walker
bind = CTRL SUPER, D, exec, eww active-windows | grep -q dashboard && eww close dashboard || (eww update active-tab='dashboard' cal-day=$(date +%d) cal-month=$(date +%m) cal-year=$(date +%Y) && eww open dashboard --screen $(hyprctl monitors -j | jq '.[] | select(.focused==true) | .id'))


# btop → workspace 4
exec-once = [workspace 4 silent] ghostty -e btop
