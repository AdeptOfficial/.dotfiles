# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Rice defaults (migrated from omarchy)
source = ~/.config/rice/defaults/hypr/autostart.conf
source = ~/.config/rice/defaults/hypr/bindings/media.conf
source = ~/.config/rice/defaults/hypr/bindings/clipboard.conf
source = ~/.config/rice/defaults/hypr/bindings/tiling-v2.conf
source = ~/.config/rice/defaults/hypr/bindings/utilities.conf
source = ~/.config/rice/defaults/hypr/envs.conf
source = ~/.config/rice/defaults/hypr/looknfeel.conf
source = ~/.config/rice/defaults/hypr/input.conf
source = ~/.config/rice/defaults/hypr/windows.conf
source = ~/.config/themes/current/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/windows.conf

# Add any other personal Hyprland configuration below
# test comment from dotfiles
misc {
  vrr = 2  # 0=off, 1=on, 2=fullscreen only (fixes desktop flickering)
}

