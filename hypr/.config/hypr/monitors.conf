# Monitor Configuration
# See https://wiki.hyprland.org/Configuring/Monitors/
#
# Machine-specific monitor settings go in monitors.local.conf
# (gitignored - customize per machine, no git conflicts)
#
# List current monitors: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Source machine-specific monitor config
source = ~/.config/hypr/monitors.local.conf
