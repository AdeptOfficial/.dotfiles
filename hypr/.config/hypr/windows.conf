# =========================
# Window rules (user)
# Hyprland 0.53+ (new syntax)
# =========================

# eww syna-dashboard - no compositor rounding (use CSS instead)
windowrule = rounding 0, match:class ^(eww)$


# Chromium → workspace 2 (runtime/manual launches)
#windowrule = workspace 2 silent, match:initialClass ^(chromium|google-chrome|brave)$

# btop → workspace 4
#windowrule = workspace 4 silent, match:class ^(ghostty)$, match:title ^(btop)

# Waydroid - fullscreen on primary monitor
windowrule {
    name = waydroid
    match:class = ^(Waydroid)$
    workspace = 3
    size = 2560 1440
    center = on
    fullscreen = on
    fullscreen_state = 2 2
    no_blur = on
    idle_inhibit = always
}

xwayland {
  force_zero_scaling = true
}

# Steam and games use workspace 3, mapped to the primary monitor locally.
# Include startup/loading windows and dialogs, whose titles vary.
windowrule = workspace 3, match:class ^([Ss]team)$
windowrule = fullscreen on, match:class ^(steam)$, match:title ^(Steam Big Picture Mode)$
windowrule {
    name = steam-games
    match:class = ^(steam_app_[0-9]+)$
    workspace = 3
    opacity = 1 1
    no_blur = on
    idle_inhibit = fullscreen
}

# Moonlight launcher and streams use the primary gaming workspace.
windowrule = workspace 3, match:class ^(com[.]moonlight_stream[.]Moonlight|[Mm]oonlight)$

# Route the outer Gamescope window as well as native Steam game windows.
windowrule {
    name = gamescope-gaming
    match:class = ^(gamescope)$
    workspace = 3
    fullscreen = on
    opacity = 1 1
    no_blur = on
    idle_inhibit = fullscreen
}

# Keep terminal text and theme backgrounds solid in every desktop theme.
windowrule = opacity 1.0 override 1.0 override, match:class ^(com[.]mitchellh[.]ghostty|ghostty)$
windowrule = no_blur on, match:class ^(com[.]mitchellh[.]ghostty|ghostty)$

# Theme chooser: show an opaque centered preview without rearranging terminals.
windowrule = float on, match:class ^(syna-theme-picker.*)$
windowrule = size 860 740, match:class ^(syna-theme-picker.*)$
windowrule = center on, match:class ^(syna-theme-picker.*)$
windowrule = opacity 1 override 1 override, match:class ^(syna-theme-picker.*)$
