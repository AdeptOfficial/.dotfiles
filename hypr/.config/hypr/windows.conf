# =========================
# Window rules (user)
# Hyprland 0.53+
# =========================

# Chromium → workspace 2 (runtime/manual launches)
#windowrulev2 = workspace 2 silent, initialClass:^(chromium|google-chrome|brave)$

# btop → workspace 4
#windowrulev2 = workspace 4 silent, class:^(ghostty)$, title:^(btop)

# Waydroid
windowrulev2 = monitor desc:Acer Technologies XB271HU, class:^(Waydroid)$
windowrulev2 = size 2560 1440, class:^(Waydroid)$
windowrulev2 = center, class:^(Waydroid)$
windowrulev2 = fullscreen, class:^(Waydroid)$
windowrulev2 = fullscreenstate 2 2, class:^(Waydroid)$
windowrulev2 = noblur, class:^(Waydroid)$
windowrulev2 = idleinhibit always, class:^(Waydroid)$

xwayland {
  force_zero_scaling = true
}
