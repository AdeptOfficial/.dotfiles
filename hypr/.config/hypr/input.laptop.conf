# ASUS ROG Zephyrus G14 Laptop Input Configuration
# Optimized for trackpad use
#
# To use: Replace input.conf with this file
# cp input.laptop.conf input.conf

input {
    kb_options = compose:caps

    repeat_rate = 40
    repeat_delay = 600
    numlock_by_default = false  # No numpad on laptop

    # Trackpad-friendly: adaptive acceleration
    accel_profile = adaptive

    # Neutral sensitivity (adjust if trackpad feels too fast/slow)
    sensitivity = 0

    # Touchpad settings
    touchpad {
        natural_scroll = true          # Mac-style scrolling
        tap-to-click = true
        drag_lock = false
        disable_while_typing = true
        scroll_factor = 1.0
    }
}

# Touchpad gestures
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.5
}

# Scroll speed in terminals (touchpad optimized)
windowrule = scrolltouchpad 1.0, class:(Alacritty|kitty|com.mitchellh.ghostty)
