# SynaOS lock screen (theme-specific file, approved in .trusted-styles.json; other themes use the template).
# Colours + splash-style elements; the shared layout (~/.config/hypr/hyprlock.conf) adds background and input field.
$color = rgba(10,16,20,1.0)
$inner_color = rgba(17,26,33,0.85)
$outer_color = rgba(63,212,230,1.0)
$font_color = rgba(239,248,250,1.0)
$placeholder_color = rgba(126,149,160,1.0)
$check_color = rgba(63,212,230,1.0)
$placeholder = <span foreground="##3fd4e6">adept</span><span foreground="##7e95a0">@</span><span foreground="##e359c9">syna</span><span foreground="##7e95a0">:~ </span><span foreground="##3fd4e6">❯</span><span foreground="##7e95a0"> unlock</span>

image {
    monitor =
    path = ~/.config/themes/current/lock-emblem.png
    size = 170
    rounding = 0
    border_size = 0
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = syna locked
    color = rgba(227,89,201,1.0)
    font_size = 30
    font_family = JetBrains Mono ExtraBold
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:50] date +'%a %d %b  ·  %H:%M:%S.%3N'   # same format/rate as the Waybar clock
    color = rgba(126,149,160,1.0)
    font_size = 16
    font_family = JetBrains Mono
    position = 0, -110
    halign = center
    valign = center
}

label {
    monitor =
    text = <span foreground="##7e95a0">// code-signed by </span><span foreground="##3fd4e6">AdepT_X</span><span foreground="##7e95a0"> · stay sad and dead </span><span foreground="##e359c9">&lt;3</span>
    font_size = 13
    font_family = JetBrains Mono
    position = 0, 40
    halign = center
    valign = bottom
}
