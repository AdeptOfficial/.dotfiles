[username]
style_user = "bold #3fd4e6"
style_root = "bold #f0597f"
format = "[$user]($style)"
disabled = false
show_always = true

[hostname]
ssh_only = false
format = "[@](bold #7e95a0)[$hostname]($style) "
style = "bold #e359c9"
disabled = false

[directory]
format = ": [$path]($style) "
style = "bold #7e95a0"
truncation_length = 0
truncate_to_repo = false

[character]
success_symbol = "[❯](bold #3fd4e6)"
error_symbol = "[❯](bold #f0597f)"

# Disable everything else for minimal prompt
[git_branch]
disabled = true
[git_status]
disabled = true
[package]
disabled = true
[nodejs]
disabled = true
[python]
disabled = true
[rust]
disabled = true
