[username]
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style)"
disabled = false
show_always = true

[hostname]
ssh_only = false
format = "[@$hostname]($style) "
style = "bold green"
disabled = false

[directory]
format = ": [$path]($style) "
style = "bold cyan"
truncation_length = 0
truncate_to_repo = false

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Disable everything else for minimal prompt
[git_branch]
disabled = true
[git_status]
disabled = true
[package]
disabled = true
[nodejs]
disabled = true
[python]
disabled = true
[rust]
disabled = true
