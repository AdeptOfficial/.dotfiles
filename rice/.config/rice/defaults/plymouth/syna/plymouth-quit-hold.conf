# Keep the Syna splash on screen a little longer: with TPM unlock the boot is so fast that the splash
# shows for ~1-2 s after the nvidia-drm mode switch. sddm is ordered After=plymouth-quit.service, so
# this delays the login handover by the same amount. "-" = a failed sleep never blocks the quit.
# Install: sudo install -Dm644 plymouth-quit-hold.conf /etc/systemd/system/plymouth-quit.service.d/syna-hold.conf
# Remove:  sudo rm /etc/systemd/system/plymouth-quit.service.d/syna-hold.conf && sudo systemctl daemon-reload
[Service]
ExecStartPre=-/usr/bin/sleep 3
